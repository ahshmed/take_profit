name: take_profit
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.5+9

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_screenutil: ^5.5.3+2
  keyboard_actions: ^4.2.0
  hive: ^2.2.3
  #  webview_flutter: ^2.0.4
  path_provider: ^2.0.11
  flutter_offline:
  cached_network_image: ^3.0.0
  image_cropper: ^11.0.0
  carousel_slider: ^5.1.1
  hidden_drawer_menu: ^3.0.1
  url_launcher: ^6.1.5
  flutter_riverpod: ^2.6.1
  lottie: ^3.3.2
  file_picker: ^10.3.3
  easy_localization: ^3.0.0
  pin_code_fields: ^8.0.1
  share_plus: ^12.0.0
  expandable: ^5.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.6.0
  visibility_detector: ^0.4.0+2
  readmore: ^3.0.0
  flutter_zoom_drawer: ^3.0.3
  fl_chart: ^1.1.1
  wechat_assets_picker: ^9.8.0
  flutter_calendar_carousel: ^2.4.0
  flutter_staggered_grid_view: ^0.7.0
  blur: ^4.0.2
  image_picker: ^1.2.0
  flutter_html: ^3.0.0-alpha.5
  http: ^1.5.0
  dotted_line: ^3.1.0
  flutter_inappwebview:
  badges: ^3.1.2
  flutter_swipe_action_cell: ^3.1.6
  flutter_svg: ^2.2.1

  # Firebase Messaging
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2

  # For Device Info
  device_info_plus: ^12.1.0

  # Social Media Plugins
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^7.0.1


  #In APP Purchase For Apple Payment
  in_app_purchase: ^3.1.8
  synchronized: ^3.1.0

  #Advertisement
  appsflyer_sdk: ^6.17.7
  app_tracking_transparency:
  firebase_core: ^4.2.0
  image: ^4.5.4
  video_player: ^2.10.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/luncher.png"

  # Mask Text Input Formatter
  #  mask_text_input_formatter: ^2.3.0
  #  flutter_masked_text2: ^0.9.1

flutter_native_splash:
  color: "#ffffff"               # Background color (use your AppColor or brand color)
  image: assets/images/splash12_android.png  # Path to your splash image
  android: true
  ios: false
  web: false                     # Optional, disable for web if not needed
  android_12:
    color: "#ffffff"
    image: assets/images/splash12_android.png




dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  build_runner: ^2.2.0
  freezed: ^3.2.3
  json_serializable: ^6.3.1
  web_socket_channel: ^3.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash12_android.png
    - assets/fonts/
    - assets/json/
    - lang/
    - assets/svgs/
    - assets/video/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Bold.ttf
        - asset: assets/fonts/Almarai-ExtraBold.ttf
        - asset: assets/fonts/Almarai-Light.ttf
        - asset: assets/fonts/Almarai-Regular.ttf

    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Black.ttf
        - asset: assets/fonts/Gilroy-BlackItalic.ttf
        - asset: assets/fonts/Gilroy-Bold.ttf
        - asset: assets/fonts/Gilroy-BoldItalic.ttf
        - asset: assets/fonts/Gilroy-ExtraBold.ttf
        - asset: assets/fonts/Gilroy-ExtraBoldItalic.ttf
        - asset: assets/fonts/Gilroy-Heavy.ttf
        - asset: assets/fonts/Gilroy-HeavyItalic.ttf
        - asset: assets/fonts/Gilroy-Light.ttf
        - asset: assets/fonts/Gilroy-LightItalic.ttf
        - asset: assets/fonts/Gilroy-Medium.ttf
        - asset: assets/fonts/Gilroy-MediumItalic.ttf
        - asset: assets/fonts/Gilroy-Regular.ttf
        - asset: assets/fonts/Gilroy-RegularItalic.ttf
        - asset: assets/fonts/Gilroy-SemiBold.ttf
        - asset: assets/fonts/Gilroy-SemiBoldItalic.ttf
        - asset: assets/fonts/Gilroy-Thin.ttf
        - asset: assets/fonts/Gilroy-Thin.ttf
        - asset: assets/fonts/Gilroy-UltraLight.ttf
        - asset: assets/fonts/Gilroy-UltraLightItalic.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraLight.ttf
