name: take_profit
description: "Merged Flutter project for TakeProfit app"
publish_to: 'none'

version: 1.0.5+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Core dependencies
  dio: ^5.9.0
  flutter_screenutil: ^5.5.3+2
  keyboard_actions: ^4.2.0
  hive: ^2.2.3
  path_provider: ^2.0.11
  flutter_offline:
  cached_network_image: ^3.0.0
  image_cropper: ^11.0.0
  carousel_slider: ^5.1.1
  hidden_drawer_menu: ^3.0.1
  url_launcher: ^6.1.5
  flutter_riverpod: ^2.6.1
  lottie: ^3.3.2
  file_picker: ^10.3.3
  easy_localization: ^3.0.0
  pin_code_fields: ^8.0.1
  share_plus: ^12.0.0
  expandable: ^5.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.6.0
  visibility_detector: ^0.4.0+2
  readmore: ^3.0.0
  flutter_zoom_drawer: ^3.0.3
  fl_chart: ^1.1.1
  wechat_assets_picker: ^9.8.0
  flutter_calendar_carousel: ^2.4.0
  flutter_staggered_grid_view: ^0.7.0
  blur: ^4.0.2
  image_picker: ^1.2.0
  flutter_html: ^3.0.0-alpha.5
  http: ^1.5.0
  dotted_line: ^3.1.0
  flutter_inappwebview:
  badges: ^3.1.2
  flutter_swipe_action_cell: ^3.1.6
  flutter_svg: ^2.2.1
  flutter_native_image: 0.0.6+1
  video_player: ^2.10.0
  image: ^4.5.4

  # Firebase & notifications
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0

  # Device info
  device_info_plus: ^12.1.0

  # Social login
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^7.0.1
  twitter_login: ^4.3.1

  # In-app purchase
  in_app_purchase: ^3.1.8
  synchronized: ^3.1.0

  # Ads / analytics
  appsflyer_sdk: ^6.17.7
  app_tracking_transparency:

  # Flutter utilities
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dependency_overrides:
  firebase_core_platform_interface: ^6.0.2  # Keep from old project for compatibility
  connectivity_plus: ^5.0.2
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  share_plus: ^10.0.2  # Changed from 9.0.0 to 10.0.2
  web: ^1.1.0  # Add this to resolve the conflict
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  build_runner: ^2.2.0
  freezed: ^3.2.3
  json_serializable: ^6.3.1
  web_socket_channel: ^3.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/splash12_android.png
    - assets/fonts/
    - assets/json/
    - lang/
    - assets/svgs/
    - assets/video/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-BlackItalic.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins-Light.ttf
        - asset: assets/fonts/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins-ThinItalic.ttf

    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Bold.ttf
        - asset: assets/fonts/Almarai-ExtraBold.ttf
        - asset: assets/fonts/Almarai-Light.ttf
        - asset: assets/fonts/Almarai-Regular.ttf

    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Black.ttf
        - asset: assets/fonts/Gilroy-BlackItalic.ttf
        - asset: assets/fonts/Gilroy-Bold.ttf
        - asset: assets/fonts/Gilroy-BoldItalic.ttf
        - asset: assets/fonts/Gilroy-ExtraBold.ttf
        - asset: assets/fonts/Gilroy-ExtraBoldItalic.ttf
        - asset: assets/fonts/Gilroy-Heavy.ttf
        - asset: assets/fonts/Gilroy-HeavyItalic.ttf
        - asset: assets/fonts/Gilroy-Light.ttf
        - asset: assets/fonts/Gilroy-LightItalic.ttf
        - asset: assets/fonts/Gilroy-Medium.ttf
        - asset: assets/fonts/Gilroy-MediumItalic.ttf
        - asset: assets/fonts/Gilroy-Regular.ttf
        - asset: assets/fonts/Gilroy-RegularItalic.ttf
        - asset: assets/fonts/Gilroy-SemiBold.ttf
        - asset: assets/fonts/Gilroy-SemiBoldItalic.ttf
        - asset: assets/fonts/Gilroy-Thin.ttf
        - asset: assets/fonts/Gilroy-ThinItalic.ttf
        - asset: assets/fonts/Gilroy-UltraLight.ttf
        - asset: assets/fonts/Gilroy-UltraLightItalic.ttf

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash12_android.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#ffffff"
    image: assets/images/splash12_android.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/luncher.png"
